services:
  # 기존 pkpkdupr.duckdns.org 앱 스택입니다. 서비스명과 mysql-data 볼륨을 유지합니다.
  web:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkpkdupr-web:${IMAGE_TAG:-latest}
    container_name: pkpkdupr-web-app
    networks:
      - pkpkdupr-network

  admin-web:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkpkdupr-admin-web:${IMAGE_TAG:-latest}
    container_name: pkpkdupr-admin-web-app
    networks:
      - pkpkdupr-network

  api:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkpkdupr-api:${IMAGE_TAG:-latest}
    container_name: pkpkdupr-api-server
    environment:
      NODE_ENV: production
      DB_SERVER_URL: http://db-server:5001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DOMAIN: ${DOMAIN:-pkpkdupr.duckdns.org}
      WEB_PUBLIC_PORT: ${WEB_PUBLIC_PORT:-443}
      ADMIN_STACK_PORT: ${ADMIN_STACK_PORT:-3333}
      API_ADMIN_USERNAME: ${API_ADMIN_USERNAME:-admin}
      API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD:-admin123qwe}
      USER_AUTH_PROVIDER: ${USER_AUTH_PROVIDER:-password}
      CORS_ADDITIONAL_ORIGINS: ${CORS_ADDITIONAL_ORIGINS:-}
      AVATAR_UPLOAD_DIR: /app/data/uploads/avatars
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: pkpkdupr-api
      NEW_RELIC_NO_CONFIG_FILE: "true"
      NEW_RELIC_LOG: stdout
      NEW_RELIC_HOST: ${NEW_RELIC_HOST:-collector.newrelic.com}
    volumes:
      - ${APP_DATA_PATH:-${PKPKDUPR_DEPLOY_PATH:-.}/data}/uploads/avatars:/app/data/uploads/avatars
    depends_on:
      db-server:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - pkpkdupr-network

  mysql:
    image: mysql:9.7
    container_name: pkpkdupr-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pkpkdupr}
      MYSQL_USER: ${MYSQL_USER:-pkpkdupr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
      MYSQL_VIEWER_USER: ${MYSQL_VIEWER_USER:-pkpkdupr_viewer}
      MYSQL_VIEWER_PASSWORD: ${MYSQL_VIEWER_PASSWORD:-change-viewer-me}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    expose:
      - "3306"
    networks:
      - pkpkdupr-network

  db-server:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkpkdupr-db-server:${IMAGE_TAG:-latest}
    container_name: pkpkdupr-db-server
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-pkpkdupr}
      DB_USER: ${MYSQL_USER:-pkpkdupr}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: pkpkdupr-db-server
      NEW_RELIC_NO_CONFIG_FILE: "true"
      NEW_RELIC_LOG: stdout
      NEW_RELIC_HOST: ${NEW_RELIC_HOST:-collector.newrelic.com}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - pkpkdupr-network

  adminer:
    image: adminer:4.8.1
    container_name: pkpkdupr-adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pkpkdupr-network

networks:
  pkpkdupr-network:
    driver: bridge

volumes:
  # 기존 운영 데이터가 사용하는 Compose 프로젝트 볼륨 이름을 유지합니다.
  mysql-data:
