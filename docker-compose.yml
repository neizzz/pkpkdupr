services:
   # 🔒 Reverse Proxy & SSL (Let's Encrypt) - DuckDNS DNS 검증 사용
  proxy:
    image: linuxserver/swag:latest
    container_name: pkpkdupr-proxy
    cap_add:
        - NET_ADMIN
    volumes:
        - ${PKPKDUPR_DEPLOY_PATH:-.}/data/certs:/config
    environment:
        - PUID=1000
        - PGID=1000
        - TZ=Asia/Seoul
        - URL=${DOMAIN:-pkpkdupr.duckdns.org}
        - VALIDATION=dns
        - DNSPLUGIN=duckdns
        - DUCKDNSTOKEN=${DUCKDNSTOKEN}
        - SUBDOMAINS= # 현재는 기본 도메인만 사용하므로 비워둠
    ports:
        - "${WEB_PUBLIC_PORT:-443}:443"
        - "${ADMIN_STACK_PORT:-3333}:3333"
    networks:
        - pkpkdupr-network

   # 🌐 Web Application (Internal Only)
  web:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkpkdupr-web:${IMAGE_TAG:-latest}
    container_name: pkpkdupr-web-app
    depends_on:
        - proxy
    networks:
        - pkpkdupr-network

  admin-web:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkpkdupr-admin-web:${IMAGE_TAG:-latest}
    container_name: pkpkdupr-admin-web-app
    depends_on:
        - proxy
    networks:
        - pkpkdupr-network

   # ⚙️ API Server (Internal Only)
  api:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkpkdupr-api:${IMAGE_TAG:-latest}
    container_name: pkpkdupr-api-server
    environment:
        - NODE_ENV=production
        - DB_SERVER_URL=http://db-server:5001
        - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
        - DOMAIN=${DOMAIN:-pkpkdupr.duckdns.org}
        - WEB_PUBLIC_PORT=${WEB_PUBLIC_PORT:-443}
        - ADMIN_STACK_PORT=${ADMIN_STACK_PORT:-3333}
        - API_ADMIN_USERNAME=${API_ADMIN_USERNAME:-admin}
        - API_ADMIN_PASSWORD=${API_ADMIN_PASSWORD:-admin123qwe}
        - AVATAR_UPLOAD_DIR=/app/data/uploads/avatars
    volumes:
        # API가 /uploads/avatars/*로 서빙하는 프로필 이미지 영구 저장소입니다.
        # 운영 reverse proxy는 /uploads/avatars/* 요청을 api:4000으로 전달해야 합니다.
        - ${PKPKDUPR_DEPLOY_PATH:-.}/data/uploads/avatars:/app/data/uploads/avatars
    depends_on:
        db-server:
          condition: service_healthy
    expose:
        - "4000"
    networks:
        - pkpkdupr-network

  # 🐬 MySQL (Internal Only)
  mysql:
    image: mysql:9.7
    container_name: pkpkdupr-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-pkpkdupr}
      - MYSQL_USER=${MYSQL_USER:-pkpkdupr}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change-me}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change-root-me}
      - MYSQL_VIEWER_USER=${MYSQL_VIEWER_USER:-pkpkdupr_viewer}
      - MYSQL_VIEWER_PASSWORD=${MYSQL_VIEWER_PASSWORD:-change-viewer-me}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    expose:
      - "3306"
    networks:
      - pkpkdupr-network

   # 💾 Database Server (MySQL)
  db-server:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkpkdupr-db-server:${IMAGE_TAG:-latest}
    container_name: pkpkdupr-db-server
    environment:
        - DB_HOST=mysql
        - DB_PORT=3306
        - DB_NAME=${MYSQL_DATABASE:-pkpkdupr}
        - DB_USER=${MYSQL_USER:-pkpkdupr}
        - DB_PASSWORD=${MYSQL_PASSWORD:-change-me}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5001"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://localhost:5001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
        - pkpkdupr-network

  adminer:
    image: adminer:4.8.1
    container_name: pkpkdupr-adminer
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pkpkdupr-network

networks:
  pkpkdupr-network:
    driver: bridge

volumes:
  mysql-data:
