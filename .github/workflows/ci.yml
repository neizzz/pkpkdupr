name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Resolve app version
        run: |
          APP_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0+$(git rev-parse --short=8 HEAD)")"
          echo "VITE_APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Docker Compose config
        run: docker compose -f docker-compose.pkelo.yml -f docker-compose.pkelo.build.yml config

      - name: Check scripts syntax
        run: |
          bash -n scripts/dev-pkelo-db.sh
          bash -n scripts/dev-pkelo.sh

      - name: Docker build
        run: docker compose -f docker-compose.pkelo.yml -f docker-compose.pkelo.build.yml build pkelo-web pkelo-admin-web pkelo-api pkelo-db-server
