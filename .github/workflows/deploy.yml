name: build-app-images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "빌드할 앱 소스 ref입니다. 비워두면 실행한 ref를 사용합니다."
        required: false
        type: string
      image_tag:
        description: "GHCR 이미지 태그입니다. 앱별 고유 태그를 입력하세요."
        required: true
        type: string
      api_base_url:
        description: "웹에 빌드할 API base URL입니다. 런타임 호스트 계산을 쓰면 비워둡니다."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: neizzz

jobs:
  build_and_push_images:
    name: Build and push app images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
          fetch-tags: true

      - name: Resolve image metadata
        run: |
          echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${{ inputs.image_tag }}" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            VITE_API_BASE_URL=${{ inputs.api_base_url }}
            VITE_APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pkpkdupr-web:${{ env.IMAGE_TAG }}

      - name: Build and push admin-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-web/Dockerfile
          build-args: |
            VITE_APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pkpkdupr-admin-web:${{ env.IMAGE_TAG }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pkpkdupr-api:${{ env.IMAGE_TAG }}

      - name: Build and push DB server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/db-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pkpkdupr-db-server:${{ env.IMAGE_TAG }}

      - name: Summarize image build
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 앱 이미지 push 완료

          - source ref: \`$(git rev-parse --short=8 HEAD)\`
          - 이미지 태그: \`${IMAGE_TAG}\`
          - Web: \`${REGISTRY}/${IMAGE_NAMESPACE}/pkpkdupr-web:${IMAGE_TAG}\`
          - Admin Web: \`${REGISTRY}/${IMAGE_NAMESPACE}/pkpkdupr-admin-web:${IMAGE_TAG}\`
          - API: \`${REGISTRY}/${IMAGE_NAMESPACE}/pkpkdupr-api:${IMAGE_TAG}\`
          - DB Server: \`${REGISTRY}/${IMAGE_NAMESPACE}/pkpkdupr-db-server:${IMAGE_TAG}\`

          이 workflow는 GHCR 이미지 push만 수행합니다. 운영 반영과 SWAG reload는 공용 \`infra\` checkout에서 대상 앱 스택만 지정해 실행합니다.
          EOF
