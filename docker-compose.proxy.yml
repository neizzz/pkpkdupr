services:
  proxy:
    image: linuxserver/swag:latest
    container_name: pkpkdupr-proxy
    cap_add:
      - NET_ADMIN
    volumes:
      - ${PKPKDUPR_DEPLOY_PATH:-.}/data/certs:/config
      # pkelo.app Cloudflare DNS-01 인증서가 갱신하는 파일을 읽기 전용으로 공유합니다.
      - ${PKPKDUPR_DEPLOY_PATH:-.}/data/pkelo-certs/etc/letsencrypt:/config/pkelo-certs:ro
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Seoul}
      URL: ${DOMAIN:-pkpkdupr.duckdns.org}
      VALIDATION: dns
      DNSPLUGIN: duckdns
      DUCKDNSTOKEN: ${DUCKDNSTOKEN}
      SUBDOMAINS: ""
      SWAG_AUTORELOAD: "true"
      SWAG_AUTORELOAD_WATCHLIST: /config/pkelo-certs
    ports:
      - "${WEB_PUBLIC_PORT:-443}:443"
      - "${ADMIN_STACK_PORT:-3333}:3333"
    networks:
      - pkpkdupr-gateway

networks:
  pkpkdupr-gateway:
    name: ${GATEWAY_NETWORK:-pkpkdupr-gateway}
    driver: bridge
