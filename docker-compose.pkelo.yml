services:
  pkelo-web:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkelo-web:${IMAGE_TAG:-latest}
    container_name: pkelo-web-app
    networks:
      - pkelo-network

  pkelo-admin-web:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkelo-admin-web:${IMAGE_TAG:-latest}
    container_name: pkelo-admin-web-app
    networks:
      - pkelo-network

  pkelo-api:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkelo-api:${IMAGE_TAG:-latest}
    container_name: pkelo-api-server
    environment:
      NODE_ENV: production
      DB_SERVER_URL: http://pkelo-db-server:5001
      JWT_SECRET: ${JWT_SECRET:-pkelo-dev-secret-change-me}
      DOMAIN: ${DOMAIN:-pkelo.app}
      WEB_PUBLIC_PORT: ${WEB_PUBLIC_PORT:-443}
      ADMIN_STACK_PORT: ${ADMIN_STACK_PORT:-3333}
      API_ADMIN_USERNAME: ${API_ADMIN_USERNAME:-admin}
      API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD:-admin123qwe}
      USER_AUTH_PROVIDER: ${USER_AUTH_PROVIDER:-kakao}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-https://${DOMAIN:-pkelo.app}/auth/kakao/callback}
      KAKAO_WEB_ORIGIN: ${KAKAO_WEB_ORIGIN:-https://${DOMAIN:-pkelo.app}}
      KAKAO_MOCK_SUBJECT: ${KAKAO_MOCK_SUBJECT:-}
      CORS_ADDITIONAL_ORIGINS: ${CORS_ADDITIONAL_ORIGINS:-}
      AVATAR_UPLOAD_DIR: /app/data/uploads/avatars
      PKELO_RUNTIME_NOTICE_FILE: /app/data/runtime-notice/notice.json
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: pkelo-api
      NEW_RELIC_NO_CONFIG_FILE: "true"
      NEW_RELIC_LOG: stdout
      NEW_RELIC_HOST: ${NEW_RELIC_HOST:-collector.newrelic.com}
    volumes:
      - ${APP_DATA_PATH:-./data/pkelo}/uploads/avatars:/app/data/uploads/avatars
      - ${PKELO_NOTICE_DATA_PATH:-${PKPKDUPR_DEPLOY_PATH:-.}/data/pkelo-notice}/public:/app/data/runtime-notice:ro
    depends_on:
      pkelo-db-server:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - pkelo-network

  pkelo-mysql:
    image: mysql:9.7
    container_name: pkelo-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pkelo}
      MYSQL_USER: ${MYSQL_USER:-pkelo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
      MYSQL_VIEWER_USER: ${MYSQL_VIEWER_USER:-pkelo_viewer}
      MYSQL_VIEWER_PASSWORD: ${MYSQL_VIEWER_PASSWORD:-change-viewer-me}
    volumes:
      - pkelo-mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    expose:
      - "3306"
    networks:
      - pkelo-network

  pkelo-db-server:
    image: ghcr.io/${GHCR_NAMESPACE:-neizzz}/pkelo-db-server:${IMAGE_TAG:-latest}
    container_name: pkelo-db-server
    environment:
      DB_HOST: pkelo-mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-pkelo}
      DB_USER: ${MYSQL_USER:-pkelo}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: pkelo-db-server
      NEW_RELIC_NO_CONFIG_FILE: "true"
      NEW_RELIC_LOG: stdout
      NEW_RELIC_HOST: ${NEW_RELIC_HOST:-collector.newrelic.com}
    depends_on:
      pkelo-mysql:
        condition: service_healthy
    expose:
      - "5001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - pkelo-network

  pkelo-adminer:
    image: adminer:4.8.1
    container_name: pkelo-adminer
    environment:
      ADMINER_DEFAULT_SERVER: pkelo-mysql
    expose:
      - "8080"
    depends_on:
      pkelo-mysql:
        condition: service_healthy
    networks:
      - pkelo-network

networks:
  pkelo-network:
    driver: bridge

volumes:
  pkelo-mysql-data:
    name: pkelo-mysql-data
